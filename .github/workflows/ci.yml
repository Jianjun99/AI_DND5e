name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Full verification in the isolated Docker test container
        run: npm run verify

      - name: Keep verification logs and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: artifacts/verify/
          if-no-files-found: error
