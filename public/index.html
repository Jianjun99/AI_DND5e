<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title data-i18n="app.title">AI Dungeon — D&D 2024</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#/">🐉 AI Dungeon</a>
      <nav>
        <a href="#/" data-nav="home" data-i18n="nav.heroes">Characters</a>
        <a href="#/overworld" data-nav="overworld" data-i18n="nav.overworld">🗺️ Overworld</a>
        <a href="#/create" data-nav="create" data-i18n="nav.create">Create</a>
        <button id="topSettingsBtn" class="topbar-settings-btn" data-i18n="nav.settings" data-i18n-title="nav.settingsTitle" title="Audio Mixer, AI DM & Game Settings">⚙️ Settings</button>
        <label class="topbar-locale"><span data-i18n="locale.label">Language</span>
          <select id="topLocaleSelect" data-locale-select data-i18n-aria-label="locale.label">
            <option value="zh-CN">简体中文</option><option value="en">English</option>
          </select>
        </label>
        <a href="#/" id="continueBtn" class="continue hidden" data-nav="continue">⚔ Continue</a>
      </nav>
    </header>
    <main id="view"></main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script>
    // PWA: register the offline service worker (silently skipped where unsupported)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
    }
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
